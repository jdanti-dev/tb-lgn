<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDC Hardware Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/tb-lgn/assets/index-C9g6-BTh.js"></script>
    <link rel="stylesheet" crossorigin href="/tb-lgn/assets/index-C8OtLbky.css">
  </head>
  <body>
    <div id="app">
      <div class="glass-card">
        <div class="header">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          <h1>Hardware Verification</h1>
        </div>
        
        <p class="subtitle">Ensuring restricted execution environment</p>

        <div id="status-container" class="status-container loading">
           <div class="spinner"></div>
           <p id="status-text">Detecting Local Agent...</p>
        </div>

        <div id="result-container" class="result-container hidden">
            <div class="data-row">
                <span class="label">Machine ID:</span>
                <span class="value" id="val-mac">--</span>
            </div>
            <div class="data-row">
                <span class="label">Host Name:</span>
                <span class="value" id="val-host">--</span>
            </div>
            <div class="data-row">
                <span class="label">OS Version:</span>
                <span class="value" id="val-os">--</span>
            </div>
            <button class="btn-primary" id="continue-btn" disabled>Access System</button>
        </div>
      </div>
    </div>
    
  </body>
</html>
